[project]
name = "hms"
version = "0.1.0"
description = "A simple terminal interface for interacting with the Pi coding agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.29.0",
]

[project.scripts]
pi-agent = "agent.__main__:main"
pi-diagnose = "roles.diagnose:main"
pi-primitive = "roles.primitive:main"
pi-reproduce = "roles.reproduce:main"
pi-pipeline = "tui.__main__:main"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["agent", "tui"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
